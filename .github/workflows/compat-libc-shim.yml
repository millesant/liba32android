name: ARM32 libc memory string shim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  arm32-libc-memory-string-shim:
    name: ARM32 libc memory string shim integration
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev binutils zlib1g-dev

      - name: Ensure pinned NDK
        run: |
          set -euxo pipefail
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          test -x "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"

      - name: Build reproducible ARM32 partial libc fixture
        run: |
          set -euxo pipefail
          bash -n tools/fixtures/build_arm32_libc_memory_string_fixture.sh
          rm -rf build-fixtures/libc-ms build-fixtures/libc-ms-second
          bash tools/fixtures/build_arm32_libc_memory_string_fixture.sh             "$ANDROID_HOME/ndk/$NDK_VERSION"             build-fixtures/libc-ms
          bash tools/fixtures/build_arm32_libc_memory_string_fixture.sh             "$ANDROID_HOME/ndk/$NDK_VERSION"             build-fixtures/libc-ms-second
          cmp             build-fixtures/libc-ms/libc.so             build-fixtures/libc-ms-second/libc.so
          cmp             build-fixtures/libc-ms/liba32android_libc_memory_string_consumer.so             build-fixtures/libc-ms-second/liba32android_libc_memory_string_consumer.so
          cmp             build-fixtures/libc-ms/liba32android_pthread_lifecycle_consumer.so             build-fixtures/libc-ms-second/liba32android_pthread_lifecycle_consumer.so

          readelf -dW build-fixtures/libc-ms/libc.so |
            tee build-fixtures/libc-ms-shim-dynamic.txt
          readelf -sW build-fixtures/libc-ms/libc.so |
            tee build-fixtures/libc-ms-shim-symbols.txt
          readelf -dW build-fixtures/libc-ms/liba32android_libc_memory_string_consumer.so |
            tee build-fixtures/libc-ms-consumer-dynamic.txt
          readelf -rW build-fixtures/libc-ms/liba32android_libc_memory_string_consumer.so |
            tee build-fixtures/libc-ms-consumer-relocations.txt
          readelf -dW build-fixtures/libc-ms/liba32android_pthread_lifecycle_consumer.so |
            tee build-fixtures/libc-ms-pthread-consumer-dynamic.txt
          readelf -rW build-fixtures/libc-ms/liba32android_pthread_lifecycle_consumer.so |
            tee build-fixtures/libc-ms-pthread-consumer-relocations.txt

          grep -F 'Library soname: [libc.so]' build-fixtures/libc-ms-shim-dynamic.txt
          grep -F 'Shared library: [libc.so]' build-fixtures/libc-ms-consumer-dynamic.txt
          grep -F '(FINI_ARRAY)' build-fixtures/libc-ms-consumer-dynamic.txt
          for symbol in memcpy memmove memset memcmp memchr strlen strcmp strncmp memmem strcpy strncpy atoi strtol __errno malloc calloc realloc free __aeabi_atexit __cxa_finalize __aeabi_memcpy __aeabi_memcpy4 __aeabi_memcpy8 __aeabi_memmove __aeabi_memmove4 __aeabi_memmove8 __aeabi_memset __aeabi_memset4 __aeabi_memset8 __aeabi_memclr __aeabi_memclr4 __aeabi_memclr8 pthread_mutex_init pthread_mutex_destroy pthread_mutex_lock pthread_mutex_trylock pthread_mutex_unlock sem_init sem_destroy sem_wait sem_post pthread_key_create pthread_key_delete pthread_getspecific pthread_setspecific; do
            grep -F "$symbol" build-fixtures/libc-ms-shim-symbols.txt
            grep -F 'R_ARM_JUMP_SLOT' build-fixtures/libc-ms-consumer-relocations.txt |
              grep -F "$symbol"
          done
          grep -F 'Shared library: [libc.so]' build-fixtures/libc-ms-pthread-consumer-dynamic.txt
          for symbol in pthread_attr_init pthread_attr_destroy pthread_attr_getdetachstate pthread_attr_setdetachstate pthread_attr_getstacksize pthread_attr_setstacksize pthread_create pthread_self pthread_equal pthread_exit; do
            grep -F "$symbol" build-fixtures/libc-ms-shim-symbols.txt
            grep -F 'R_ARM_JUMP_SLOT' build-fixtures/libc-ms-pthread-consumer-relocations.txt |
              grep -F "$symbol"
          done

          sha256sum             build-fixtures/libc-ms/libc.so             build-fixtures/libc-ms/liba32android_libc_memory_string_consumer.so             build-fixtures/libc-ms/liba32android_pthread_lifecycle_consumer.so

      - name: Configure integration
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DLIBA32ANDROID_BUILD_TESTS=ON             -DLIBA32ANDROID_ARM32_LIBC_MEMORY_STRING_CONSUMER_PATH="$GITHUB_WORKSPACE/build-fixtures/libc-ms/liba32android_libc_memory_string_consumer.so"             -DLIBA32ANDROID_ARM32_LIBC_MEMORY_STRING_SHIM_PATH="$GITHUB_WORKSPACE/build-fixtures/libc-ms/libc.so"             -DLIBA32ANDROID_ARM32_PTHREAD_LIFECYCLE_CONSUMER_PATH="$GITHUB_WORKSPACE/build-fixtures/libc-ms/liba32android_pthread_lifecycle_consumer.so"

      - name: Build integration
        run: cmake --build build --target compat_libc_memory_string_shim_integration_test compat_pthread_lifecycle_shim_integration_test --parallel 2

      - name: Test integration
        run: |
          set -euxo pipefail
          ctest --test-dir build --output-on-failure -R '^a32_libc_memory_string_shim_integration$'
          build/compat_libc_memory_string_shim_integration_test             build-fixtures/libc-ms/liba32android_libc_memory_string_consumer.so             build-fixtures/libc-ms/libc.so |
            tee build-fixtures/libc-ms-integration-evidence.txt
          grep -F 'fixture.libc.object_count=2' build-fixtures/libc-ms-integration-evidence.txt
          grep -F 'fixture.libc.needed=libc.so' build-fixtures/libc-ms-integration-evidence.txt
          grep -F 'fixture.libc.namespace_access=linked' build-fixtures/libc-ms-integration-evidence.txt
          grep -F 'fixture.libc.required_jump_slots=45' build-fixtures/libc-ms-integration-evidence.txt
          grep -F 'fixture.libc.completed_service_calls=45' build-fixtures/libc-ms-integration-evidence.txt
          grep -F 'fixture.libc.fini_array_calls=1' build-fixtures/libc-ms-integration-evidence.txt
          grep -F 'fixture.libc.status=PASS' build-fixtures/libc-ms-integration-evidence.txt

          ctest --test-dir build --output-on-failure -R '^a32_pthread_lifecycle_shim_integration
      - name: Upload partial libc integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: arm32-libc-memory-string-shim
          path: |
            build-fixtures/libc-ms/libc.so
            build-fixtures/libc-ms/liba32android_libc_memory_string_consumer.so
            build-fixtures/libc-ms/liba32android_pthread_lifecycle_consumer.so
            build-fixtures/libc-ms-shim-dynamic.txt
            build-fixtures/libc-ms-shim-symbols.txt
            build-fixtures/libc-ms-consumer-dynamic.txt
            build-fixtures/libc-ms-consumer-relocations.txt
            build-fixtures/libc-ms-pthread-consumer-dynamic.txt
            build-fixtures/libc-ms-pthread-consumer-relocations.txt
            build-fixtures/libc-ms-integration-evidence.txt
            build-fixtures/libc-ms-pthread-lifecycle-evidence.txt
          if-no-files-found: error
          retention-days: 14

          build/compat_pthread_lifecycle_shim_integration_test             build-fixtures/libc-ms/liba32android_pthread_lifecycle_consumer.so             build-fixtures/libc-ms/libc.so |
            tee build-fixtures/libc-ms-pthread-lifecycle-evidence.txt
          grep -F 'fixture.pthread_lifecycle.object_count=2' build-fixtures/libc-ms-pthread-lifecycle-evidence.txt
          grep -F 'fixture.pthread_lifecycle.required_jump_slots=10' build-fixtures/libc-ms-pthread-lifecycle-evidence.txt
          grep -F 'fixture.pthread_lifecycle.wrapper_calls=11' build-fixtures/libc-ms-pthread-lifecycle-evidence.txt
          grep -F 'fixture.pthread_lifecycle.thread_exits=2' build-fixtures/libc-ms-pthread-lifecycle-evidence.txt
          grep -F 'fixture.pthread_lifecycle.status=PASS' build-fixtures/libc-ms-pthread-lifecycle-evidence.txt

      - name: Upload partial libc integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: arm32-libc-memory-string-shim
          path: |
            build-fixtures/libc-ms/libc.so
            build-fixtures/libc-ms/liba32android_libc_memory_string_consumer.so
            build-fixtures/libc-ms-shim-dynamic.txt
            build-fixtures/libc-ms-shim-symbols.txt
            build-fixtures/libc-ms-consumer-dynamic.txt
            build-fixtures/libc-ms-consumer-relocations.txt
            build-fixtures/libc-ms-integration-evidence.txt
          if-no-files-found: error
          retention-days: 14
