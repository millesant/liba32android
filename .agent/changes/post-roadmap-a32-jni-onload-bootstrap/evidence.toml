[[evidence]]
id = "android-jni-invocation-layout"
kind = "external"
status = "observed"
claim = "Android JNI invocation layout places JavaVM::GetEnv at slot 6; Dalvik GetEnv accepts the inclusive JNI 1.1..1.6 numeric range and returns JNI_EVERSION before touching env outside that range."
source = "docs/research/evidence/arm32-jni-entrypoints-2026-09-27.md"
result = "Official Android libnativehelper/Dalvik sources and supplied libmla machine code agree on ARM32 GetEnv offset 0x18."
limitations = "The first compatibility VM models the current guest execution context as already attached; Attach/Detach semantics remain separate."

[[evidence]]
id = "dalvik-onload-version-policy"
kind = "external"
status = "observed"
claim = "Dalvik accepts JNI_OnLoad only when the returned version is exactly JNI 1.2, 1.4, or 1.6."
source = "docs/research/evidence/arm32-jni-entrypoints-2026-09-27.md"
result = "The exact-object JNI_OnLoad transaction validates the same three accepted return values."
limitations = ""

[[evidence]]
id = "supplied-arm32-jni-entrypoints"
kind = "artifact"
status = "observed"
claim = "Supplied ARMv7 VLC/MLA/FMOD libraries export JNI_OnLoad, and libmla contains real GetEnv and RegisterNatives C++ wrappers."
source = "docs/research/evidence/arm32-jni-entrypoints-2026-09-27.md"
result = "libmla machine code uses JavaVM offset 0x18 for GetEnv and JNIEnv offset 0x35c (slot 215) for RegisterNatives."
limitations = "The supplied binaries are evidence inputs only and are not checked into the repository."

