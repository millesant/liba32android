  "a real generated ARM32 shared-library fixture exports JNI_OnLoad, calls JavaVM::GetEnv through the guest invoke table, verifies the returned JNIEnv pointer, and returns JNI_VERSION_1_6",
  "supplied VLC/libmla/libfmod evidence records exported JNI_OnLoad functions; libmla evidence additionally shows JavaVM::GetEnv and JNIEnv::RegisterNatives wrappers, motivating RegisterNatives as the next JNI slice",
