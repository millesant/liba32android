schema = 1
change = "post-roadmap-arm32-libdl-load-policy"

[[evidence]]
id = "bionic-lp32-dlfcn-abi"
kind = "external"
status = "observed"
claim = "Android bionic LP32 uses the historical ARM32-compatible RTLD values and documents RTLD_LAZY as unsupported while Android uses eager RTLD_NOW behavior."
source = "https://android.googlesource.com/platform/bionic/+/main/libc/include/dlfcn.h"
result = "Current bionic main defines RTLD_NOLOAD=0x00004 and RTLD_NODELETE=0x01000, and its !__LP64__ override defines RTLD_NOW=0, RTLD_GLOBAL=2, RTLD_DEFAULT=0xffffffff, and RTLD_NEXT=0xfffffffe; RTLD_LAZY remains 1."
limitations = "The source defines ABI constants and Android behavior; LibA32Android's bounded ownership model remains repository-specific."

[[evidence]]
id = "root-policy-regression"
kind = "test"
status = "not_run"
claim = "Focused ELF coverage proves exact Active dependency root creation, Local-to-Global promotion, monotonic NODELETE retention, deterministic global membership, and retired-object rejection."
source = "tests/elf/unit/elf32_dependency_loader.cpp"
result = "Integrated but exact-head execution has not yet been observed."
limitations = ""

[[evidence]]
id = "resident-libdl-policy-regression"
kind = "test"
status = "not_run"
claim = "Focused resident libdl coverage proves LP32 constants, NOLOAD resident acquisition/promotion, Local non-demotion, missing NOLOAD behavior, and RTLD_DEFAULT/RTLD_NEXT sentinel handling."
source = "tests/compat/a32_libdl.cpp"
result = "Integrated but exact-head execution has not yet been observed."
limitations = "RTLD_NEXT lookup itself remains intentionally unsupported."

[[evidence]]
id = "dynamic-policy-regression"
kind = "test"
status = "not_run"
claim = "Focused dynamic-open coverage proves NOLOAD provider suppression, resident NOLOAD root creation/promotion, and Global promotion of newly acquired roots while retaining eager relocation."
source = "tests/compat/a32_libdl_open_transaction.cpp"
result = "Integrated but exact-head execution has not yet been observed."
limitations = "RTLD_LAZY is accepted as an ABI flag but no lazy relocation machinery is claimed."

[[evidence]]
id = "nodelete-close-regressions"
kind = "test"
status = "not_run"
claim = "Exact-object and physical-unload close regressions prove NODELETE final close clears only the synthetic handle, skips lifecycle/reclamation, survives a plain reopen, and remains mapped/Active."
source = "tests/compat/a32_libdl_close_transaction.cpp and tests/compat/a32_libdl_unload_transaction.cpp"
result = "Integrated but exact-head execution has not yet been observed."
limitations = "NODELETE process-exit teardown remains separate."

