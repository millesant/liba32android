acceptance = [
  "static evidence records that supplied FMOD and VLC ARMv7 libvlc.so both import memcpy, memset, memcmp, memchr, strlen, strcmp, and strncmp from their wider libc dependency surface",
  "one preprocessor-safe compatibility header defines shared guest/host private SVC IDs 0xA1 through 0xA7 for those seven primitives",
  "A32LibcMemoryStringService implements the existing A32HostServiceHandler seam and uses only logical GuestMemory addresses plus AAPCS32 r0-r2 machine-word arguments",
  "caller-selected transfer and string ceilings bound all scans/copies and logical 32-bit range wrap or guest-memory faults fail explicitly",
  "memcpy reads the complete bounded source before attempting destination mutation and returns the destination guest pointer",
  "memset/memchr/memcmp implement byte semantics; comparison calls return only portable negative/zero/positive signed-int results",
  "strlen accepts an exact-ceiling payload followed by NUL; strcmp and strncmp stop as soon as their result is determined while respecting their configured bounds",
  "zero-count transfer/compare/search calls perform no guest-memory access and return their ordinary result",
  "focused tests cover all seven operations, signs/pointers, exact bounds, faults, wrap, unknown IDs, and ARM SVC -> registry -> dispatcher composition",
  "no guest libc.so provider/shim, allocator, stdio/I/O, pthread, dynamic-loader, libm, errno, or platform-provider installation is introduced",
  "feature 030 integrates only after feature 029, and is not closed until exact-head required checks pass"
]

