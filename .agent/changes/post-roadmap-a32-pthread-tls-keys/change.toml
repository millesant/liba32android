  "pthread_key_delete clears all bounded values for that key without invoking destructors and returns Android EINVAL for unknown/deleted keys",
  "the reproducible partial libc shim and consumer export, relocate, and execute all four new TLS wrappers, increasing eager JUMP_SLOT and completed service-call evidence from 41 to 45",
  "thread-exit destructor execution/iterations, pthread_create/join/detach/self/equal, cancellation, and host TLS remain outside this slice",
  "accepted spec/architecture/state/evidence converge and exact-head required checks pass"
