  "focused tests cover decimal atoi, overflow, hex/binary/octal auto-base, no digits, invalid base without input read, underflow, endptr, byte ceiling, unwritable endptr, unknown SVC, and ARM registry/dispatcher composition",
  "no guest atoi/strtol exports, guest __errno/TLS, locale-aware ctype, unsigned/wide/64-bit conversion, floating conversion, or broader libc state is introduced",
  "feature 035 integrates after features 029-034 and closes only after exact-head required checks pass"
