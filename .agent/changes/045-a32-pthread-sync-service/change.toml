  "contended lock/wait return feature-044 Suspended only after setting their eventual guest return value, so wake resumes after the SVC without replay",
  "focused ARM execution regressions prove mutex and semaphore suspend -> grant -> ready publication -> bounded resume ordering",
  "the partial ARM32 libc.so and consumer add five mutex plus four semaphore exports for thirty-nine eager JUMP_SLOT targets and thirty-nine executed wrappers",
  "pthread_create/join/detach, attrs/types, pthread_once, condition variables, rwlocks, TLS, pthread_self ABI, process-shared semaphores, futex internals, and scheduler policy remain out of scope"
