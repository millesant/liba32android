acceptance = [
  "A32AndroidPlatformProvider implements the existing requester-aware Elf32DependencyProvider contract and recognizes only exact liblog.so in feature 028",
  "exact liblog.so requests pass requester identity and requested-name bytes unchanged to one caller-owned A32AndroidPlatformAccessPolicy",
  "policy Allow delegates to the existing exact-name catalog semantics while NotFound and Failed propagate without publishing source data",
  "unknown names return NotFound without invoking policy and context-free resolve represents requester identity as empty",
  "the provider borrows policy and shim image for its lifetime, owns only its catalog entry, and is non-copyable/non-movable because its internal catalog span refers to member storage",
  "focused compatibility tests cover exact requester bytes, success, policy NotFound/Failed, unknown-name short circuit, context-free behavior, empty/oversize image failures, and application-first provider-chain fallback",
  "the real ARM32 liblog integration uses application provider then platform provider and proves android-log-consumer reaches policy unchanged before dependency loading, relocation, shim execution, and host service dispatch complete",
  "no Android namespace graph, path search, public-library allowlist, preload/RTLD policy, or automatic provider installation is introduced",
  "exact-head dedicated shim integration, Linux A32 smoke, and both required Android checks pass before the feature is closed"
]

