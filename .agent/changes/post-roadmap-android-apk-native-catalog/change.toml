acceptance = [
  "A32ApkLibrarySource exposes one bounded native-library catalog operation for a caller-selected APK path and relative ABI directory",
  "exact-entry loading and catalog enumeration share the same ZIP32 archive-open/central-directory parser rather than maintaining a second archive parser",
  "catalog enumeration considers only direct entries below <abi-directory>/ whose basename is a non-empty bare .so name; nested paths and non-.so entries are ignored",
  "caller-selected maximum library count, per-SONAME bytes, total SONAME bytes, ABI-directory bytes, archive bytes, ZIP entry count, central-directory bytes, and ZIP entry-name bytes are enforced before unbounded publication",
  "duplicate direct SONAMEs are rejected as ambiguous even if their ZIP metadata or payload is identical",
  "successful catalog output is deterministic lexicographic SONAME order and owns its strings",
  "missing APK returns NotFound while malformed/ZIP64/multi-disk/truncated central-directory state returns Failed using the same accepted ZIP32 structural validation as load",
  "focused regressions cover direct filtering, deterministic order, duplicate ambiguity, library/per-name/total-name/catalog path ceilings, missing APK, malformed ABI directories, and bootstrap consumption of discovered SONAMEs",
  "the supplied VLC APK evidence maps the caller-selected lib/armeabi-v7a directory to exactly libc++_shared.so, libmla.so, libvlc.so, and libvlcjni.so",
  "ABI auto-detection, manifest/root selection, split-APK merging, package discovery, JNI startup, graphics/audio, patching, and device deployment remain separate"
]

