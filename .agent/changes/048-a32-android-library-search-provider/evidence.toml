claim = "The supplied VLC APK stores ARMv7 DSOs under lib/armeabi-v7a and contains app-local dependency edges requiring native-library search beyond the platform catalog."
source = "docs/research/evidence/arm32-android-app-library-search-2026-09-27.md"
result = "Bounded APK/readelf inspection records libc++_shared.so, libmla.so, libvlc.so, and libvlcjni.so under lib/armeabi-v7a; libvlcjni needs libvlc and libmla needs libvlc plus libc++_shared."
limitations = "Static package layout does not establish the full package-manager/linker search configuration used on every Android device."

