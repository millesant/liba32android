acceptance = [
  "supplied FMOD imports dlopen/dlsym/dlclose/dlerror and the supplied VLC ARMv7 set additionally imports dladdr",
  "A32LibDlService borrows a persistent Elf32LinkMap, finite handle metadata, and bounded guest scratch without exposing host pointers",
  "dlopen accepts only RTLD_LAZY/RTLD_NOW and acquires/refcounts an exact already-resident SONAME/identity or the first root for null filename; missing objects return null plus pending dlerror",
  "dlsym resolves synthetic handles through bounded graph lookup, supports RTLD_DEFAULT process-root/global-root lookup, and rejects RTLD_NEXT explicitly",
  "dlclose is refcount-only and never unmaps objects or runs destructors",
  "dlerror publishes one bounded guest string and clears it after one read",
  "dladdr publishes logical guest Dl_info module/base data and nearest bounded dynamic-symbol metadata without host pointers",
  "a reproducible ARM32 libdl.so shim exports all five target-backed functions and real namespace-gated integration executes resident dlopen/dlsym/dladdr/dlclose/dlerror against a separate application DSO",
  "missing-object dynamic acquisition, Android filesystem/search, RTLD_GLOBAL/NOLOAD/NODELETE, RTLD_NEXT, unload/destructor lifecycle, and persistent constructor/destructor called-state remain deferred"
]

