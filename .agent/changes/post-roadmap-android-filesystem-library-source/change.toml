acceptance = [
  "A32FilesystemLibrarySource implements concrete regular-file acquisition without changing the generic ELF dependency-provider contract",
  "source paths are non-empty, NUL-free, bounded by caller max_path_bytes, and consumed without canonicalization or basename/path rewriting",
  "ENOENT and ENOTDIR return NotFound while other open/stat/read failures return Failed",
  "only non-empty regular files are accepted and the exact caller max_image_bytes ceiling is enforced before allocation/read publication",
  "interrupted reads are retried and premature EOF fails without publishing a partial image",
  "successful source identity is the exact candidate path and returned image bytes are owned",
  "focused tests cover exact read, missing file, image/path ceilings, directory rejection, embedded NUL rejection, and requester-search composition",
  "real ARM32 app-search integration acquires the child DSO through the filesystem source, then loads, relocates, and executes it",
  "APK/ZIP parsing, AssetManager/package-manager policy, path canonicalization, explicit-path dlopen, and richer Android linker search remain out of scope"
]

