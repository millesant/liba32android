  "unknown/dead arrays, overlapping leases, wrong pointers, invalid release modes, oversize arrays, and unreadable guest scratch fail deterministically",
  "NewByteArray, Get/SetByteArrayRegion, other primitive-array families, Java framework behavior, and host-pointer publication remain outside this slice",
  "focused regressions cover slots/stubs, seeded bytes and length, copy-out, isCopy, commit/abort/final release, liveness, bounds, lease identity, and guest-memory failures",
  "accepted spec/architecture/state/evidence converge and exact-head required checks pass"
