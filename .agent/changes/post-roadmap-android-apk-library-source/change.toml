acceptance = [
  "A32ApkLibrarySource implements the existing A32AndroidLibrarySource contract for exact <archive>!/<entry> virtual paths without extraction-to-disk",
  "archive, virtual-path, entry-count, central-directory, entry-name, and image byte ceilings are caller selected and enforced before unbounded allocation or publication",
  "the source accepts ordinary single-disk ZIP32 stored and raw-DEFLATE entries, uses system/NDK zlib for DEFLATE, and validates the published uncompressed size and CRC32",
  "missing archive or exact entry returns NotFound while malformed archives, duplicate exact entry names, encryption, ZIP64 sentinels, unsupported compression, local/central metadata disagreement, premature EOF, and CRC mismatch return Failed",
  "successful identity is the exact virtual path and returned ELF bytes are owned",
  "the supplied VLC 3.7.2 Beta 2 APK evidence records that all four armeabi-v7a native libraries use ZIP method 8 / DEFLATE",
  "focused regressions cover stored and deflated success, requester-search composition, missing entry/archive, malformed virtual paths, archive/entry/central/image ceilings, encryption/unsupported method, duplicate names, ZIP64 rejection, local-header disagreement, and CRC failure",
  "the real ARM32 app-search integration packages the generated child DSO into a deterministic DEFLATED mini-APK and executes requester search -> APK source -> ELF load -> relocation -> ARM32 call",
  "package-manager/AssetManager discovery, APK signatures, split-APK selection, extraction policy, explicit-path dlopen, and general ZIP rewriting remain separate"
]

