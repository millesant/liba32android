acceptance = [
  "A32AndroidNamespaceAccessPolicy implements the feature-028 platform access-policy seam without changing generic ELF provider APIs",
  "caller-owned exact requester bindings map opaque requester identity bytes to one non-empty namespace and ambiguous matching bindings fail explicitly",
  "same-platform-namespace requests are allowed without a link while missing requester bindings remain NotFound",
  "cross-namespace access requires exactly one direct requester-namespace to platform-namespace link and duplicate matching links fail explicitly",
  "a matching link uses exactly one AOSP-shaped accessibility mode: allow-all with an empty explicit list, or a non-empty exact SONAME list",
  "malformed matching link configuration returns Failed while unrelated malformed bindings or links do not poison exact lookup",
  "focused tests cover embedded-NUL requester bytes, explicit SONAME allow/deny, same namespace, allow-all, missing/duplicate/empty bindings, missing/duplicate/malformed links, and empty platform namespace",
  "the real ARM32 liblog integration uses an exact android-log-consumer -> app binding plus app -> platform liblog.so link before platform-provider fallback, relocation, shim SVC, and log-service execution",
  "no path inference, transitive namespace traversal, filesystem/APK search, RUNPATH/RPATH, LD_LIBRARY_PATH, preload/RTLD semantics, config-file parser, or additional platform shim is introduced",
  "feature 029 is not closed until it is integrated on the validated base and exact-head required checks pass"
]

